          <text x="40" y="44" font-size="12" fill="#8b91a0">192.168.1.37 · joined 12m ago</text>
          <g transform="translate(636,12)"><rect width="84" height="30" rx="8" fill="#1b1b23" stroke="rgba(255,255,255,0.08)"/><text x="42" y="20" text-anchor="middle" font-size="12.5" fill="#c7ccda">Send</text></g>
