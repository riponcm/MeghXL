name: Feature request
description: Suggest something MeghXL should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution — it often leads somewhere better.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like MeghXL to do?
    validations: { required: true }
  - type: checkboxes
    id: constraints
    attributes:
      label: Does it fit MeghXL's design constraints?
      description: See [CONTRIBUTING.md](https://github.com/riponcm/MeghXL/blob/main/CONTRIBUTING.md). Tick what applies — an unticked box isn't a rejection, it just tells us what to discuss.
      options:
        - label: It works without exposing MeghXL to the internet
        - label: It doesn't require installing anything on the receiving device
        - label: It doesn't send any data off the user's machine
        - label: It doesn't add a build step to the front-end
