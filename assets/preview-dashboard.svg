<svg viewBox="0 0 1200 780" width="1200" height="780" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="MeghXL dashboard: sidebar navigation, public files with QR and one-time badges, and the shared message board">
