# Builds the MeghXL desktop app for every supported platform.
#
# Push a tag (v1.1.0) to produce a DRAFT GitHub release with all four
# installers attached; run it manually to get the same builds as downloadable
# artifacts without publishing anything.
#
# Tauri cannot cross-compile between operating systems, so each target builds
# on its own runner. The Node server is compiled to a self-contained binary by
# Bun first, then bundled as a Tauri sidecar.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # Platform signing switches on only once its secrets exist, so the
      # workflow keeps working (unsigned) before they're added.
      MAC_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      WIN_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            # Cross-compiled on Apple Silicon: GitHub's last Intel image
            # (macos-13) left this job queued forever, and an Intel build made
            # anywhere but CI couldn't be signed and notarized with the others.
            os: macos-14
            target: x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      # WebKitGTK is the webview Tauri uses on Linux; libxdo backs the tray.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Pinned: the server is compiled with Bun, and a release shouldn't change
      # compiler behind our back. Bun 1.4.4's Linux build made the AppImage
      # tool's library scan (ldd) fail. Move this on purpose, after testing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      # The server's own dependencies — Bun bundles these into the sidecar.
      - name: Install server dependencies
        run: npm ci

      - name: Install desktop tooling
        run: npm ci
        working-directory: desktop

      # Compiles server.js into one executable named for the target triple and
      # stages public/ beside it, which is what the bundler expects to find.
      - name: Compile the server sidecar
        shell: bash
        run: bash desktop/scripts/build-server.sh ${{ matrix.target }}

      # Linux: .deb and .rpm only, no AppImage. Building an AppImage runs
      # linuxdeploy, which rewrites every program it packs (patchelf RUNPATH);
      # that corrupts self-contained executables like the Bun-compiled server
      # and then crashes on them ("Failed to run ldd"). Open upstream as
      # tauri-apps/tauri#5189. The updater handles .deb and .rpm installs.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: echo "LINUX_ARGS=--bundles deb,rpm" >> "$GITHUB_ENV"

      # ---- macOS: Developer ID signing + notarization -----------------------
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          # A throwaway keychain for this run only; its password needn't be a secret.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          # A certificate pasted into GitHub may carry spaces or line breaks.
          printf '%s' "$APPLE_CERTIFICATE" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')
          if [ -z "$ID" ]; then
            echo "::error::No 'Developer ID Application' identity in APPLE_CERTIFICATE. Other certificate types can't be notarized for direct download."
            exit 1
          fi
          # If APPLE_SIGNING_IDENTITY is set, it must name the certificate we imported.
          WANT=$(printf '%s' "$APPLE_SIGNING_IDENTITY" | tr -d '\r\n')
          if [ -n "$WANT" ] && [ "$WANT" != "$ID" ] && ! printf '%s' "$ID" | grep -qF "$WANT"; then
            echo "::error::APPLE_SIGNING_IDENTITY ('$WANT') doesn't match the certificate in APPLE_CERTIFICATE ('$ID')."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "Signing as: $ID"

      # Export notarization credentials ONLY when they have values. GitHub passes
      # an unset secret as an empty string, and Tauri treats an empty APPLE_ID
      # as "use the Apple ID method" — which would override a working API key
      # and fail notarization with empty credentials.
      - name: Prepare notarization credentials
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Values pasted into GitHub may end with a line break, which would
          # break GITHUB_ENV; strip them.
          clean() { printf '%s' "$1" | tr -d '\r\n'; }
          APPLE_API_KEY=$(clean "$APPLE_API_KEY"); APPLE_API_ISSUER=$(clean "$APPLE_API_ISSUER")
          APPLE_ID=$(clean "$APPLE_ID"); APPLE_PASSWORD=$(clean "$APPLE_PASSWORD"); APPLE_TEAM_ID=$(clean "$APPLE_TEAM_ID")
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            { echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; } >> "$GITHUB_ENV"
            echo "Notarizing with the App Store Connect API key."
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
            echo "Notarizing with Apple ID + app-specific password."
          else
            echo "::error::APPLE_CERTIFICATE is set but notarization isn't: add APPLE_API_KEY_P8 + APPLE_API_KEY + APPLE_API_ISSUER (or APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID)."
            exit 1
          fi

      # ---- Windows: Azure Artifact Signing (account matily-signing, profile
      # matily-public), the same as NextGenUp. release-signing.json wires the
      # sign command; it's only passed when the Azure secrets exist, so the
      # build still works (unsigned) without them. Tauri signs the app, the
      # bundled server and the installers with it.
      - name: Set up Windows signing
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          echo "WIN_SIGN_ARGS=--config src-tauri/release-signing.json" >> "$GITHUB_ENV"

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles. Without these the build still succeeds,
          # it just produces no latest.json, so in-app updates stay off.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The app registration allowed to sign with the matily-public profile.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # macOS signing identity and notarization credentials arrive through
          # GITHUB_ENV from the steps above — only when they're configured.
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }} ${{ env.WIN_SIGN_ARGS }} ${{ env.LINUX_ARGS }}
          # Only set on a tag push, which is what makes tauri-action publish.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: MeghXL __VERSION__
          # Placeholder — real notes are written when the draft is published.
          releaseBody: Download the build for your platform below.
          releaseDraft: true
          # Publishes latest.json, which the app's "Check for updates" reads.
          uploadUpdaterJson: true

      - name: Verify signature, notarization and the signed server
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        run: |
          APP="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/MeghXL.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP/Contents/MacOS/meghxl-server" 2>/dev/null | grep -q allow-jit \
            || { echo "::error::Server sidecar is missing the JIT entitlements"; exit 1; }
          spctl --assess --type execute --verbose=4 "$APP"   # Gatekeeper: passes only if notarized
          xcrun stapler validate "$APP"
          # The real signed server, under the hardened runtime, on real hardware.
          # (Intel is cross-compiled here and can't run natively, so only arm64.)
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            mkdir -p "$RUNNER_TEMP/d/uploads"
            PORT=3999 MDNS=off PUBLIC_DIR="$APP/Contents/Resources/resources/public" \
              UPLOAD_DIR="$RUNNER_TEMP/d/uploads" DATA_FILE="$RUNNER_TEMP/d/m.json" \
              "$APP/Contents/MacOS/meghxl-server" > "$RUNNER_TEMP/srv.log" 2>&1 &
            PID=$!
            for i in $(seq 1 40); do curl -s -m 1 http://127.0.0.1:3999/api/health | grep -q ok && break; sleep 0.25; done
            for i in $(seq 1 500); do
              curl -sf -m 2 -o /dev/null http://127.0.0.1:3999/api/files || { cat "$RUNNER_TEMP/srv.log"; echo "::error::Signed server failed under load"; exit 1; }
            done
            kill -0 $PID || { cat "$RUNNER_TEMP/srv.log"; echo "::error::Signed server crashed"; exit 1; }
            kill $PID
            echo "Signed server ran 500 requests under the hardened runtime."
          fi

      # The server inside the .deb, as installed, must actually run.
      - name: Verify the packaged server (Linux)
        if: runner.os == 'Linux'
        run: |
          DEB=$(ls desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb | head -1)
          rm -rf "$RUNNER_TEMP/deb" && mkdir -p "$RUNNER_TEMP/deb/d/u"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/deb"
          S="$RUNNER_TEMP/deb/usr/bin/meghxl-server"
          PORT=3996 MDNS=off UPLOAD_DIR="$RUNNER_TEMP/deb/d/u" DATA_FILE="$RUNNER_TEMP/deb/d/m.json" "$S" > "$RUNNER_TEMP/deb.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf -m 1 http://127.0.0.1:3996/api/health > /dev/null && break; sleep 0.25; done
          curl -sf -m 2 http://127.0.0.1:3996/api/health || { cat "$RUNNER_TEMP/deb.log"; echo "::error::The packaged server doesn't start"; exit 1; }
          echo " <- the server in the .deb runs"
          kill %1

      - name: Verify the Windows signatures
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        shell: pwsh
        run: |
          # The installers (each carries the signed app) and the bundled server.
          # The loose app .exe in target/ is left unsigned by design — Tauri
          # signs a fresh copy for each installer — so it isn't checked.
          $root = "desktop/src-tauri/target/${{ matrix.target }}/release"
          $files = @(Get-ChildItem "$root/bundle" -Recurse -Include *.exe, *.msi) +
                   @(Get-ChildItem "desktop/src-tauri/binaries/meghxl-server-*.exe")
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0,-60} {1}  {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { Write-Error "$bad file(s) are not validly signed"; exit 1 }

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload installers as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: meghxl-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm

  # The updater's generic Linux entry points at the .deb. A 1.0.1 AppImage
  # (there's no AppImage since) falls back to that entry and would overwrite
  # itself with a .deb. Remove it: .deb and .rpm installs use their own
  # entries, and AppImage users are told to switch by hand.
  updater-manifest:
    name: Tidy the update manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Drop the generic linux-x86_64 entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json
          python3 - <<'EOF'
          import json
          d = json.load(open('latest.json'))
          if d['platforms'].pop('linux-x86_64', None) is not None:
              json.dump(d, open('latest.json', 'w'), indent=2)
              print('removed linux-x86_64')
          else:
              print('nothing to remove')
          EOF
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

