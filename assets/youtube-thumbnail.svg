<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a10"/><stop offset="0.5" stop-color="#140f22"/><stop offset="1" stop-color="#0a0a10"/></linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="tgText" gradientUnits="userSpaceOnUse" x1="76" y1="350" x2="600" y2="400"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="tcy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c5cf0" stop-opacity="0.55"/><stop offset="1" stop-color="#7c5cf0" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#tbg)"/>
  <circle cx="980" cy="350" r="320" fill="url(#tglow)"/>
  <!-- faint decorative rings -->
  <circle cx="980" cy="350" r="250" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="980" cy="350" r="320" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>

  <!-- brand row -->
  <g transform="translate(70,66)">
    <rect width="52" height="52" rx="14" fill="url(#tg)"/>
    <path d="M12 26 Q26 31 40 26 L36 35 Q26 39 16 35 Z" fill="#fff"/>
    <path d="M26 12 L19 33 L33 33 Z" fill="#fff"/>
    <line x1="26" y1="12" x2="26" y2="33" stroke="#6d4fe0" stroke-width="3"/>
    <text x="68" y="38" font-size="38" font-weight="800" fill="#f4f5fa">MeghXL</text>
  </g>

  <!-- headline -->
  <text x="68" y="300" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="-2">SEND ANY FILE</text>
  <text x="78" y="398" font-size="96" font-weight="900" letter-spacing="-1" fill="url(#tgText)">INSTANTLY</text>
  <text x="72" y="452" font-size="32" font-weight="500" fill="#b9bed0">across your local network — no cloud, no limits</text>

  <!-- pills -->
  <g font-size="22" font-weight="800" text-anchor="middle">
    <g><rect x="68"  y="486" width="210" height="50" rx="25" fill="url(#tcy)"/><text x="173" y="518" fill="#06121a">SELF-HOSTED</text></g>
    <g><rect x="292" y="486" width="290" height="50" rx="25" fill="none" stroke="#c084fc" stroke-width="2.5"/><text x="437" y="518" fill="#e9d9ff">FREE &amp; OPEN SOURCE</text></g>
    <g><rect x="596" y="486" width="150" height="50" rx="25" fill="none" stroke="#22d3ee" stroke-width="2.5"/><text x="671" y="518" fill="#cdf3fb">ANY SIZE</text></g>
  </g>

  <!-- watch-the-tutorial tag -->
  <g transform="translate(68,596)">
    <rect width="330" height="64" rx="14" fill="#ff0033"/>
    <polygon points="30,20 30,44 54,32" fill="#fff"/>
    <text x="76" y="41" font-size="26" font-weight="800" fill="#fff">WATCH THE TUTORIAL</text>
  </g>

  <!-- ===== right: boat scene ===== -->
  <!-- floating files -->
  <g>
    <g transform="translate(880,210)"><rect x="-18" y="-22" width="38" height="46" rx="6" fill="#eef0ff"/><rect x="-18" y="-22" width="38" height="13" rx="6" fill="#c084fc"/></g>
    <g transform="translate(1080,200)"><rect x="-16" y="-20" width="34" height="42" rx="6" fill="#eef0ff"/><rect x="-16" y="-20" width="34" height="12" rx="6" fill="#22d3ee"/></g>
    <g transform="translate(990,150)"><rect x="-15" y="-18" width="30" height="38" rx="6" fill="#eef0ff"/><rect x="-15" y="-18" width="30" height="11" rx="6" fill="#818cf8"/></g>
  </g>

  <!-- big paper boat -->
  <g transform="translate(980 380) scale(2.4)">
    <path d="M-95 -2 Q0 28 95 -2 L74 44 Q0 62 -74 44 Z" fill="url(#tcy)"/>
    <path d="M0 -80 L-40 20 L40 20 Z" fill="url(#tg)"/>
    <line x1="0" y1="-80" x2="0" y2="20" stroke="#0a0a10" stroke-width="3" opacity="0.85"/>
  </g>

  <!-- waves -->
  <g stroke-linecap="round" fill="none">
    <path d="M740 560 q26 -16 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0" stroke="url(#tcy)" stroke-width="8" opacity="0.9"/>
    <path d="M720 600 q26 -16 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0" stroke="#6366f1" stroke-width="8" opacity="0.5"/>
  </g>

  <rect x="3" y="3" width="1274" height="714" rx="20" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
</svg>
